<style>
/* ═══════════════════════════════════════════════
   KREISLAUF-GRAFIK — Förderung → Baumpflanzung
   Zwei Varianten: Kreis ab 700px, Stapel darunter
   ═══════════════════════════════════════════════ */
.kreis-desktop,.kreis-mobil{width:100%;margin:0 auto}
.kreis-desktop{display:none;max-width:960px}
.kreis-mobil{display:block;max-width:460px}
@media(min-width:700px){
  .kreis-desktop{display:block}
  .kreis-mobil{display:none}
}
.kreis-desktop svg,.kreis-mobil svg{width:100%;height:auto;display:block;font-family:inherit}

/* ── Grundlinien ── */
.kl-track{fill:none;stroke:var(--border);stroke-width:2}

/* ── Laufender Lichtpunkt ── */
.kl-pulse{
  fill:none;stroke:var(--lime-brand);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:52 1079;
  animation:kl-run 10s linear infinite;
}
.kl-pulse-soft{
  fill:none;stroke:var(--lime-brand);stroke-width:12;stroke-linecap:round;
  stroke-dasharray:95 1036;opacity:.18;
  animation:kl-run 10s linear infinite;
}
@keyframes kl-run{
  from{stroke-dashoffset:0}
  to{stroke-dashoffset:-1131}
}

/* ── Mitte ── */
.kl-core{fill:var(--card);stroke:var(--border2);stroke-width:1.5}
.kl-core-halo{
  fill:var(--lime-brand);opacity:.10;
  transform-origin:center;transform-box:fill-box;
  animation:kl-breathe 4.5s ease-in-out infinite;
}
@keyframes kl-breathe{
  0%,100%{transform:scale(1);opacity:.10}
  50%{transform:scale(1.09);opacity:.20}
}
.kl-stamm{fill:none;stroke:var(--lime);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.kl-krone{fill:var(--lime-dim);stroke:var(--lime);stroke-width:5;stroke-linejoin:round}
.kl-krone-vorn{fill:var(--lime-dim)}

/* ── Stationskarten ── */
.kl-card{fill:var(--card);stroke:var(--border2);stroke-width:1.5}
.kl-num-chip{fill:var(--lime-brand)}
.kl-num{fill:var(--on-lime,var(--bg));font-size:15px;font-weight:800;letter-spacing:.02em}
.kl-title{fill:var(--text);font-size:20px;font-weight:700;letter-spacing:-.01em}
.kl-body{fill:var(--text2);font-size:16px;font-weight:400}
.kl-arrow{fill:none;stroke:var(--lime);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kl-connect{stroke:var(--border2);stroke-width:2;stroke-linecap:round}

/* ── Mobile Stapel ── */
.kl-stack-line{stroke:var(--border2);stroke-width:2;stroke-linecap:round;fill:none}
.kl-stack-flow{
  fill:none;stroke:var(--lime-brand);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:70 700;
  animation:kl-flow 9s linear infinite;
}
@keyframes kl-flow{
  from{stroke-dashoffset:770}
  to{stroke-dashoffset:0}
}
.kl-m-title{fill:var(--text);font-size:19px;font-weight:700}
.kl-m-body{fill:var(--text2);font-size:14px}
.kl-m-percent{fill:var(--lime);font-size:38px;font-weight:800}
.kl-m-sub{fill:var(--text3);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

@media(prefers-reduced-motion:reduce){
  .kl-pulse,.kl-pulse-soft,.kl-core-halo,.kl-stack-flow{animation:none}
  .kl-pulse,.kl-pulse-soft{stroke-dasharray:none;opacity:.28}
  .kl-stack-flow{stroke-dasharray:none;opacity:.5}
}

/* ── Mobile Variante: echtes HTML statt SVG, damit die Schrift lesbar bleibt ── */
.klm-liste{list-style:none;margin:0;padding:0;position:relative}
.klm-liste::before{
  content:"";position:absolute;left:19px;top:34px;bottom:34px;width:2px;
  background:linear-gradient(to bottom,var(--lime-brand),var(--border));
}
.klm-schritt{display:flex;gap:16px;padding-bottom:26px;position:relative}
.klm-schritt:last-child{padding-bottom:0}
.klm-nr{
  flex-shrink:0;width:40px;height:40px;border-radius:50%;
  background:var(--lime-brand);color:var(--on-lime);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;letter-spacing:.02em;
  position:relative;z-index:2;
}
.klm-text{padding-top:7px;min-width:0}
.klm-text strong{display:block;font-size:17px;font-weight:800;color:var(--text);margin-bottom:6px}
.klm-text p{font-size:14.5px;color:var(--text2);line-height:1.65;margin:0}
.klm-kreis{
  margin:0 auto 28px;width:150px;height:150px;flex:none;border-radius:50%;
  border:3px solid var(--lime-brand);background:var(--lime-dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.klm-baum-svg{width:104px;height:70px;display:block}
</style>

<!-- ═══════════ VARIANTE A — Kreis (ab 700px) ═══════════ -->
<div class="kreis-desktop">
<svg viewBox="0 0 960 720" role="img" aria-labelledby="kl-t kl-d" xmlns="http://www.w3.org/2000/svg">
  <title id="kl-t">Kreislauf: Von der Forschungszulage zur gepflanzten Baumreihe</title>

  <!-- Kreisbahn: Mittelpunkt 480/330, r=180, Umfang ca. 1131 -->
  <circle class="kl-track" cx="480" cy="330" r="180"/>

  <circle class="kl-pulse" cx="480" cy="330" r="180" transform="rotate(-90 480 330)"/>

  <!-- Richtungspfeile, tangential im Uhrzeigersinn -->
  <path class="kl-arrow" d="M-8 -7 L0 0 L-8 7" transform="translate(660 330) rotate(90)"/>
  <path class="kl-arrow" d="M-8 -7 L0 0 L-8 7" transform="translate(300 330) rotate(270)"/>

  <!-- Anschlusspunkte auf der Bahn + Verbinder zu den Karten -->
  <line class="kl-connect" x1="480" y1="150" x2="480" y2="142"/>
  <line class="kl-connect" x1="480" y1="510" x2="480" y2="536"/>
  <circle cx="480" cy="150" r="6.5" fill="var(--lime-brand)"/>
  <circle cx="480" cy="510" r="6.5" fill="var(--lime-brand)"/>

  <!-- ── Mitte: Baum ── -->
  <circle class="kl-core-halo" cx="480" cy="330" r="106"/>
  <circle class="kl-core" cx="480" cy="330" r="88"/>
  <g class="kl-wald" transform="translate(480 330)">
    <g transform="translate(-44 8) scale(.66)">
      <path class="kl-stamm" d="M0 44 L0 4"/>
      <path class="kl-krone" d="M0 -40 C-24 -40 -36 -24 -36 -8 C-36 8 -21 18 0 18 C21 18 36 8 36 -8 C36 -24 24 -40 0 -40 Z"/>
    </g>
    <g transform="translate(46 12) scale(.56)">
      <path class="kl-stamm" d="M0 44 L0 4"/>
      <path class="kl-krone" d="M0 -40 C-24 -40 -36 -24 -36 -8 C-36 8 -21 18 0 18 C21 18 36 8 36 -8 C36 -24 24 -40 0 -40 Z"/>
    </g>
    <g transform="translate(0 -6)">
      <path class="kl-stamm" d="M0 46 L0 6"/>
      <path class="kl-stamm" d="M0 18 L-13 5"/>
      <path class="kl-stamm" d="M0 26 L13 13"/>
      <path class="kl-krone kl-krone-vorn" d="M0 -42 C-25 -42 -38 -25 -38 -8 C-38 9 -22 20 0 20 C22 20 38 9 38 -8 C38 -25 25 -42 0 -42 Z"/>
    </g>
  </g>

  <!-- ═══ 01 Förderung — oben ═══ -->
  <g>
    <rect class="kl-card" x="318" y="18" width="324" height="124" rx="20"/>
    <rect class="kl-num-chip" x="342" y="42" width="44" height="25" rx="12.5"/>
    <text class="kl-num" x="364" y="59.5" text-anchor="middle">01</text>
    <text class="kl-title" x="398" y="61">Förderung</text>
    <text class="kl-body" x="342" y="96">Das Unternehmen erhält die</text>
    <text class="kl-body" x="342" y="120">Forschungszulage vom Staat.</text>
  </g>

  <!-- ═══ 02 Baumpflanzung — unten ═══ -->
  <g>
    <rect class="kl-card" x="318" y="536" width="324" height="126" rx="20"/>
    <rect class="kl-num-chip" x="342" y="560" width="44" height="25" rx="12.5"/>
    <text class="kl-num" x="364" y="577.5" text-anchor="middle">02</text>
    <text class="kl-title" x="398" y="579">Baumpflanzung</text>
    <text class="kl-body" x="342" y="614">ROBIN GUT pflanzt die Bäume</text>
    <text class="kl-body" x="342" y="638">und produziert den Content.</text>
  </g>
</svg>
</div>

<!-- ═══════════ VARIANTE B — Stapel (unter 700px) ═══════════ -->
<div class="kreis-mobil">
  <p class="klm-kreis" aria-hidden="true">
    <svg viewBox="-88 -58 176 116" class="klm-baum-svg">
      <g transform="translate(-44 8) scale(.66)">
        <path class="kl-stamm" d="M0 44 L0 4"/>
        <path class="kl-krone" d="M0 -40 C-24 -40 -36 -24 -36 -8 C-36 8 -21 18 0 18 C21 18 36 8 36 -8 C36 -24 24 -40 0 -40 Z"/>
      </g>
      <g transform="translate(46 12) scale(.56)">
        <path class="kl-stamm" d="M0 44 L0 4"/>

      <g transform="translate(0 -6)">

  <ol class="klm-liste">

        <strong>Förderung</strong>

    </li>
    <li class="klm-schritt">
      <span class="klm-nr" aria-hidden="true">02</span>
